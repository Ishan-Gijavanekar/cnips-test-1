apiVersion: cnips.io/v1
kind: Function
metadata:
    name: location-weather-responder
spec:
    runtime: go
    description: Parses a POST payload for a location and returns a deterministic weather summary using configurable defaults for units, temperature, and condition.
    config:
        defaultcondition: Sunny
        defaulttemperature: "22"
        unit: C
    apiAccessRef: 57282815-78ac-4f00-aba9-4808eb457331
    signatureVersion: v2
    templateVersion: V2
