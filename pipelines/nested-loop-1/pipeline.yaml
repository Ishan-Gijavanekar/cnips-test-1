apiVersion: cnips.io/v1
kind: Pipeline
metadata:
    name: nested-loop-1
spec:
    trigger:
        type: http
    steps:
        - id: loop-dest
          uses: transformation/src-loop-test@latest
        - id: loop-dest
          uses: transformation/loop-trans2@latest
        - id: loop-dest
          uses: native/loop@1
          with:
            allowFailures: true
            arrayField: items
            batchSize: 25
            concurrency: 3
            edgeMap: []
            nestedBlocks: []
            nestedEndNodes: []
            timeout: 100
        - id: loop-dest
          uses: native/loop@1
          with:
            allowFailures: false
            arrayField: childItems
            batchSize: 4
            concurrency: 2
            edgeMap: []
            nestedBlocks: []
            nestedEndNodes: []
            timeout: 1000
        - id: loop-dest
          uses: transformation/loop-trans1@latest
        - id: loop-dest
          uses: transformation/loop-dest@latest
