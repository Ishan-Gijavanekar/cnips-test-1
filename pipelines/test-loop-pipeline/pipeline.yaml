apiVersion: cnips.io/v1
kind: Pipeline
metadata:
    name: test-loop-pipeline
spec:
    trigger:
        type: http
    steps:
        - id: check-dest1234
          uses: transformation/chech-src-testtt@latest
        - id: check-dest1234
          uses: transformation/test-trans-tt@latest
        - id: check-dest1234
          uses: native/loop@1
