            allowFailures: true
            arrayField: items
            batchSize: 10
            concurrency: 3
            edgeMap: []
            nestedBlocks: []
            nestedEndNodes: []
            timeout: 0
        - id: check-dest1234
          uses: transformation/check-dest1234@latest
